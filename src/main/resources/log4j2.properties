# Global settings
status=info
name=studyJakartaJPA

# Component declaration
appenders=console

# Define the Console Appender
appender.console.type=Console
appender.console.name=ConsoleAppender
appender.console.target=SYSTEM_OUT

# %t automatically injects the thread name in brackets
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%highlight{%d{yyyy-MM-dd HH:mm:ss.SSS}{GMT-3}[%t] %-5level %logger{36}: %m%n%throwable}

# Root Logger Configuration (Project default)
rootLogger.level=info
rootLogger.appenderRef.console.ref=ConsoleAppender

# Registers the identifier for your custom logger.
loggers=jpautil

# Enables DEBUG logs specifically for your JpaUtilTest class.
logger.jpautil.name=JpaUtilTest
logger.jpautil.level=debug
logger.jpautil.additivity=false
logger.jpautil.appenderRef.console.ref=ConsoleAppender
